name: 🐛 Bug Report
description: Reportar um bug
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Descrição
        Descreva o bug claramente.

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Vá para '...'
        2. Clique em '...'
        3. Veja o erro

    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      placeholder: O que deveria acontecer

    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamento atual
      placeholder: O que acontece atualmente

    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      placeholder: Se possível, adicione screenshots

  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      options:
        - Local (development)
        - Preview (Vercel)
        - Production
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Console
      placeholder: |
        ```
       Cole os logs aqui
        ```
